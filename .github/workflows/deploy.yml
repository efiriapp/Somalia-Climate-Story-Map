name: Deploy to Hostinger

# Builds the site and uploads dist/ to Hostinger over FTPS.
# Runs on every push to main (after tests pass) and on demand from the Actions tab.
#
# One-time setup in GitHub: Settings > Secrets and variables > Actions
#   Secrets:   FTP_SERVER     e.g. ftp.yourdomain.com or the IP from hPanel > Files > FTP Accounts
#              FTP_USERNAME
#              FTP_PASSWORD
#   Variables: SITE_URL       e.g. https://storymap.example.org (optional until the domain is ready)
#              FTP_SERVER_DIR folder on the server, default public_html/
# Until FTP_SERVER is set, the upload step is skipped and the workflow still passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}

      - name: Upload to Hostinger
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}

      - name: Skipped upload
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP_SERVER secret not set yet, so nothing was uploaded. See the comments at the top of deploy.yml."
