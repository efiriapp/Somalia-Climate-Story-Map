name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # build runs the typecheck (tsc --noEmit) before vite build
      - run: npm test
      - run: npm run build
      - run: npm run images:check
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
